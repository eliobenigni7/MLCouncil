lgbm:
  n_estimators: 1500
  learning_rate: 0.02
  num_leaves: 31
  min_child_samples: 100
  subsample: 0.7
  colsample_bytree: 0.6
  reg_alpha: 0.5
  reg_lambda: 0.3
  n_jobs: -1
  random_state: 42
  verbose: -1

cpcv:
  n_splits: 8
  embargo_days: 10
  n_test_folds: 2

# Phase 2 — meta-labeling secondary gate (off by default; train checkpoint separately)
meta_label:
  threshold: 0.55
  min_abs_signal: 0.05
  classifier:
    n_estimators: 100
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    verbose: -1

hmm:
  n_states: 3
  n_iter: 100
  covariance_type: full
  random_state: 42

regime_dss:
  embed_dim: 8
  n_epochs: 80
  learning_rate: 0.02
  kl_weight: 0.01
  random_state: 42

sentiment:
  model_name: "ProsusAI/finbert"
  fallback_model: "yiyanghkust/finbert-tone"
  recency_decay: 0.6          # gamma: day-1 weight=1.0, day-2=0.6, day-3=0.36
  batch_size: 32
  max_length: 256             # FinBERT token-limit proxy (chars)

# TFT alpha challenger (T2.1 — shadow only; not in daily Dagster path)
tft:
  encoder_length: 20
  min_history: 10
  hidden_size: 64
  num_layers: 1
  dropout: 0.1
  learning_rate: 0.001
  max_epochs: 30
  batch_size: 256
  quantiles: [0.05, 0.5, 0.95]

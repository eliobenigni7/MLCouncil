name: Walk-forward CI

on:
  schedule:
    # Weekly Monday 02:00 UTC (ADR T1.1)
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run promotion gate (skip retrain)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  walk-forward-promotion:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: [lightgbm, sentiment, hmm, tft]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed walk-forward caches
        run: python scripts/populate_walkforward_caches.py --models ${{ matrix.model }}

      - name: Run walk-forward promotion gate
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ matrix.model }}" = "lightgbm" ]; then
            EXTRA=""
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA="--dry-run"
          elif [ "${{ matrix.model }}" != "lightgbm" ]; then
            EXTRA="--dry-run"
          fi
          python scripts/run_walkforward_promotion.py \
            --model ${{ matrix.model }} \
            $EXTRA \
            --json

      - name: Upload promotion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkforward-promotion-${{ matrix.model }}
          path: data/operations/walkforward_promotion_${{ matrix.model }}.json
          if-no-files-found: ignore

# MLCouncil core stack: admin API, dashboard, Dagster, MLflow, intraday supervisor.
#
# Optional observability (Tempo, Grafana, OTel Collector):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d
#
# With tracing to collector (set in .env):
#   MLCOUNCIL_OTEL_ENABLED=true
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces

name: mlcouncil

x-mlcouncil-common-env: &mlcouncil-common-env
  ARCTICDB_URI: lmdb://data/arctic/
  MLCOUNCIL_ENV_PROFILE: ${MLCOUNCIL_ENV_PROFILE:-prod}
  MLCOUNCIL_USE_PRODUCTION_MANIFEST: ${MLCOUNCIL_USE_PRODUCTION_MANIFEST:-true}

x-otel-env: &otel-env
  MLCOUNCIL_OTEL_ENABLED: ${MLCOUNCIL_OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-mlcouncil}
  MLCOUNCIL_OTEL_NAMESPACE: ${MLCOUNCIL_OTEL_NAMESPACE:-mlcouncil}

secrets:
  alpaca_api_key:
    file: ./secrets/alpaca_api_key
  alpaca_secret_key:
    file: ./secrets/alpaca_secret_key
  polygon_api_key:
    file: ./secrets/polygon_api_key
  smtp_password:
    file: ./secrets/smtp_password

services:
  admin-api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-8000}:8000"
    secrets:
      - alpaca_api_key
      - alpaca_secret_key
      - polygon_api_key
      - smtp_password
    environment:
      <<: [*mlcouncil-common-env, *otel-env]
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DAGSTER_GRAPHQL_URL: http://dagster:3000/graphql
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      MLCOUNCIL_AUTO_EXECUTE: ${MLCOUNCIL_AUTO_EXECUTE:-false}
      MLCOUNCIL_MAX_DAILY_ORDERS: ${MLCOUNCIL_MAX_DAILY_ORDERS:-20}
      MLCOUNCIL_MAX_TURNOVER: ${MLCOUNCIL_MAX_TURNOVER:-0.50}
      MLCOUNCIL_MAX_POSITION_SIZE: ${MLCOUNCIL_MAX_POSITION_SIZE:-0.15}
      MLCOUNCIL_ADMIN_USERNAME: ${MLCOUNCIL_ADMIN_USERNAME:-}
      MLCOUNCIL_ADMIN_PASSWORD: ${MLCOUNCIL_ADMIN_PASSWORD:-}
      MLCOUNCIL_LEGACY_UI: ${MLCOUNCIL_LEGACY_UI:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_ADMIN:-mlcouncil-admin-api}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models/checkpoints:/app/models/checkpoints
    networks:
      - mlcouncil
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    build: .
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    environment:
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      <<: *mlcouncil-common-env
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./dashboard:/app/dashboard
    networks:
      - mlcouncil
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dagster:
    build: .
    ports:
      - "127.0.0.1:${DAGSTER_PORT:-3000}:3000"
    command:
      - sh
      - -c
      - mkdir -p /app/data/dagster && touch /app/data/dagster/dagster.yaml && dagster dev -f data/pipeline.py -h 0.0.0.0 -p 3000
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models/checkpoints:/app/models/checkpoints
      - ./council:/app/council
      - ./observability:/app/observability
    secrets:
      - alpaca_api_key
      - alpaca_secret_key
    env_file:
      - path: .env
        required: true
    environment:
      <<: [*mlcouncil-common-env, *otel-env]
      DAGSTER_HOME: /app/data/dagster
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_DAGSTER:-mlcouncil-dagster}
      MLCOUNCIL_ONLINE_LEARNING: ${MLCOUNCIL_ONLINE_LEARNING:-false}
      MLCOUNCIL_LLM_SENTIMENT_SHADOW: ${MLCOUNCIL_LLM_SENTIMENT_SHADOW:-false}
      MLCOUNCIL_TDA_WARNING_ENABLED: ${MLCOUNCIL_TDA_WARNING_ENABLED:-true}
    networks:
      - mlcouncil
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/server_info"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mlflow:
    build: .
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    command:
      - sh
      - -c
      - python scripts/patch_mlflow_assistant.py && python -m mlflow db upgrade sqlite:///mlflow.db && python -m mlflow server --workers 1 --host 0.0.0.0 --port 5000 --allowed-hosts "*" --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --static-prefix /mlflow
    environment:
      MLFLOW_ASSISTANT_ALLOW_PRIVATE_NETWORK: "true"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    networks:
      - mlcouncil
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/mlflow/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  intraday-supervisor:
    build: .
    command: python scripts/run_intraday_supervisor.py
    secrets:
      - alpaca_api_key
      - alpaca_secret_key
      - polygon_api_key
    environment:
      <<: [*mlcouncil-common-env, *otel-env]
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      MLCOUNCIL_INTRADAY_INTERVAL_MINUTES: ${MLCOUNCIL_INTRADAY_INTERVAL_MINUTES:-15}
      MLCOUNCIL_INTRADAY_UNIVERSE: ${MLCOUNCIL_INTRADAY_UNIVERSE:-AAPL,MSFT,NVDA,AMZN,META,GOOGL,TSLA}
      MLCOUNCIL_INTRADAY_AGENT_PROVIDER: ${MLCOUNCIL_INTRADAY_AGENT_PROVIDER:-rule-based}
      MLCOUNCIL_INTRADAY_LOG_TO_MLFLOW: ${MLCOUNCIL_INTRADAY_LOG_TO_MLFLOW:-false}
      MLCOUNCIL_AUTOMATION_PAUSED: ${MLCOUNCIL_AUTOMATION_PAUSED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_INTRADAY:-mlcouncil-intraday}
    env_file:
      - path: .env
        required: true
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./models/checkpoints:/app/models/checkpoints
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    networks:
      - mlcouncil
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped

networks:
  mlcouncil:
    name: mlcouncil-net
    driver: bridge
